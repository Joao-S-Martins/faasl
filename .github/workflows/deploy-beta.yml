# Every push to the beta branch is checked, built in beta mode (hidden from
# search engines) and deployed to the faasl-beta Worker. After launch the
# beta branch becomes `main`. See docs/deployment.md.
name: Deploy beta

on:
  push:
    branches: [v3]

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      site-env: beta

  deploy:
    needs: ci
    # Pause switch: set the *repository* variable BETA_DEPLOY_PAUSED to "true"
    # (Settings → Secrets and variables → Actions → Variables → Repository
    # variables). Environment variables aren't visible to this check.
    if: vars.BETA_DEPLOY_PAUSED != 'true'
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://faasl-beta.faasl.workers.dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Reuse resized images from earlier builds instead of reprocessing them.
      - uses: actions/cache@v6.1.0
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**', 'src/content/**/*.jpg') }}
          restore-keys: astro-assets-
      - run: npm run build
        env:
          SITE_ENV: beta
      - run: npx wrangler deploy --env beta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
