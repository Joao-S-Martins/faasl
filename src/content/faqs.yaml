# Lessons FAQ. Shown on the Lessons page and marked up as FAQPage data for search.
- id: when
  question: When are lessons?
  answer: Friday evenings. The beginner class is at 6:30 and the intermediate class at 7:15. Check the lessons calendar for changes. Lessons start on time and run 45 minutes.
  link: { label: Lessons & rehearsals calendar, calendar: lessons }
  order: 1
- id: how-long
  question: How long are lessons?
  answer: 45 minutes of instruction. Intermediate students also take part in the volunteer band rehearsal, which runs about 90 minutes.
  order: 2
- id: late
  question: What if we're late?
  answer: Please let Edgard know as soon as possible if you're running late or have to miss a lesson. When arriving late, enter quietly.
  order: 3
- id: where
  question: Where are lessons?
  answer: Lessons are taught in the same hall where our volunteer band rehearses, at 844 Alvarado St., San Leandro.
  order: 4
- id: anything-else
  question: Anything else?
  answer: Students should arrive 10 minutes early to assemble their instruments and warm up. Parents are welcome to sit near the class as long as they're completely silent, or to chat in the clubhouse.
  order: 5
