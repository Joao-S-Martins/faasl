# Type check, lint, format check and build. Runs on pull requests and on
# pushes to branches that don't deploy (the deploy workflows call it themselves).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [v3]
  workflow_call:
    inputs:
      site-env:
        description: SITE_ENV for the build
        type: string
        default: development

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          SITE_ENV: ${{ inputs.site-env || 'development' }}

  # Summarizes the live Google Calendars in the job log (how many events, how
  # often, description lengths). Informational only; never fails CI.
  events-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run events:report
