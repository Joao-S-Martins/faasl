# Type check, lint, format check and build. Runs on pull requests and on
# pushes to branches that don't deploy (the deploy workflows call it themselves).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [v3]
  workflow_call:
    inputs:
      site-env:
        description: SITE_ENV for the build
        type: string
        default: development

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          SITE_ENV: ${{ inputs.site-env || 'development' }}

  # Runs the live Google Calendar pipeline end to end: summarizes every
  # calendar, writes events.json from the live feeds, builds the site and lists
  # the events that ended up on the pages. Informational only (nothing is
  # committed or deployed); never fails CI.
  events-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Summarize the live calendars
        run: npm run events:report
      - name: Write events.json from the live calendars
        run: npm run events && git diff --stat -- src/content/events.json
      - name: Build with the live events
        run: npm run build
        env:
          SITE_ENV: beta
      - name: Events that made it onto the pages
        run: node scripts/list-built-events.mjs dist/events.html dist/index.html dist/give.html dist/lessons.html dist/musicians.html
