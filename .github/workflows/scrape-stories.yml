# One-time: print the text of the old Adobe Express stories page into the
# job log, since it can't be reached from the dev container. Delete after use.
name: Scrape stories
on:
  push:
    branches: [v3]
    paths: [.github/workflows/scrape-stories.yml]
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          cat > scrape.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
          const strings = new Set();
          const walk = (v) => {
            if (typeof v === 'string') { if (v.length > 30 && / /.test(v) && !/^(https?:|data:|M\d)/.test(v)) strings.add(v); }
            else if (v && typeof v === 'object') Object.values(v).forEach(walk);
          };
          p.on('response', async (r) => {
            const t = r.headers()['content-type'] || '';
            if (!t.includes('json')) return;
            try { const j = await r.json(); console.log('JSON', r.url().slice(0, 150)); walk(j); } catch {}
          });
          await p.goto('https://stories.faasl.org', { waitUntil: 'load', timeout: 90000 });
          await p.waitForTimeout(8000);
          for (let i = 0; i < 60; i++) {
            await p.evaluate(() => { window.scrollBy(0, 800); document.querySelectorAll('*').forEach((e) => { if (e.scrollHeight > e.clientHeight + 50) e.scrollTop += 800; }); });
            await p.waitForTimeout(400);
          }
          await p.waitForTimeout(3000);
          console.log('URL', p.url());
          for (const f of p.frames()) {
            console.log('=====FRAME', f.url().slice(0, 150));
            try {
              console.log(await f.evaluate(() => {
                const out = [];
                const visit = (root) => {
                  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
                  for (let n = w.currentNode; n; n = w.nextNode()) {
                    if (n.nodeType === 3) { const s = n.textContent.trim(); if (s) out.push(s); }
                    else if (n.shadowRoot) visit(n.shadowRoot);
                    else if (n.alt) out.push('[alt] ' + n.alt);
                  }
                };
                visit(document.body);
                return out.join('\n');
              }));
            } catch (e) { console.log('ERR', e.message); }
          }
          console.log('=====JSON STRINGS=====');
          console.log([...strings].join('\n---\n'));
          console.log('=====END=====');
          await b.close();
          JS
          node scrape.mjs
