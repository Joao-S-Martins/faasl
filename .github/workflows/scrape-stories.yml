# One-time: print the text of the old Adobe Express stories page into the
# job log, since it can't be reached from the dev container. Delete after use.
name: Scrape stories
on:
  push:
    branches: [v3]
    paths: [.github/workflows/scrape-stories.yml]
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          cat > scrape.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
          const hits = [];
          p.on('response', async (r) => {
            try {
              const t = await r.text();
              if (/Aubury/i.test(t)) hits.push({ url: r.url(), type: r.headers()['content-type'], t });
            } catch {}
          });
          await p.goto('https://stories.faasl.org', { waitUntil: 'load', timeout: 90000 });
          await p.waitForTimeout(8000);
          for (let i = 0; i < 60; i++) {
            await p.evaluate(() => { window.scrollBy(0, 800); document.querySelectorAll('*').forEach((e) => { if (e.scrollHeight > e.clientHeight + 50) e.scrollTop += 800; }); });
            await p.waitForTimeout(400);
          }
          await p.waitForTimeout(3000);
          for (const f of p.frames()) {
            const txt = await f.evaluate(() => document.body ? document.body.innerText : '').catch(() => '');
            if (/Aubury/i.test(txt)) { console.log('=====FRAME TEXT', f.url().slice(0, 150)); console.log(txt); }
          }
          console.log('=====HITS', hits.length);
          for (const h of hits) {
            console.log('=====HIT', h.url.slice(0, 200), h.type, h.t.length);
            if (/html/.test(h.type || '')) {
              const q = await b.newPage();
              await q.setContent(h.t.replace(/<script[\s\S]*?<\/script>/gi, ''), { waitUntil: 'domcontentloaded' }).catch(() => {});
              console.log(await q.evaluate(() => document.body.innerText));
              console.log('[alts]', (await q.evaluate(() => [...document.querySelectorAll('[alt],[title]')].map((e) => e.alt || e.title).filter(Boolean))).join(' | '));
              await q.close();
            } else console.log(h.t.slice(0, 3000));
          }
          console.log('=====END=====');
          await b.close();
          JS
          node scrape.mjs
